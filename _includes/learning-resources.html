<div class="learning-resources">
  <ul class="learning-resource-list">
    {% for resource in site.data.learning_resources.items %}
      <li class="learning-resource">
        <a class="learning-resource__link" href="{{ resource.url | escape }}" target="_blank" rel="noopener noreferrer">
          <span class="learning-resource__title">{{ resource.title | escape }}</span>
          {% if resource.type or resource.source %}<span class="learning-resource__meta">{{ resource.type | escape }}{% if resource.type and resource.source %} · {% endif %}{{ resource.source | escape }}</span>{% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
